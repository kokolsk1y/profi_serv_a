version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=ybrjkfq06
      - N8N_PROTOCOL=https
      - N8N_HOST=n8n-production-7fb5.up.railway.app
      - WEBHOOK_URL=https://n8n-production-7fb5.up.railway.app/
    depends_on:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=ybrjkfq06
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_storage:
  postgres_storage: